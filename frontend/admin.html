<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Logix Monitoringing System</title>
    
    <!-- External Libraries -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/jquery-ui.css" rel="stylesheet">
    <link href="css/jquery.datetimepicker.min.css" rel="stylesheet">

    <!-- CSS Files (Modular) -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pending-data.css">
    <link rel="stylesheet" href="css/klhk-success.css">
    <link rel="stylesheet" href="css/all-data.css">
    <link rel="stylesheet" href="css/logs.css">
    <link rel="stylesheet" href="css/config.css">
</head>
<body>
    
    <!-- ============== HEADER ============== -->
    <div id="header-container"></div>

    <!-- ============== MAIN CONTAINER ============== -->
    <div class="container-main">
        
        <!-- ============== SIDEBAR ============== -->
        <div id="sidebar-container"></div>

        <!-- ============== MAIN CONTENT ============== -->
        <main class="main-content">
            
            <!-- Dashboard Section -->
            <div id="dashboard-section"></div>

            <!-- Pending Data Section -->
            <div id="pending-data-section" style="display: none;"></div>

            <!-- Retry Data Section -->
            <div id="retry-section" style="display: none;"></div>

            <!-- KLHK Success Section -->
            <div id="klhk-success-section" style="display: none;"></div>

            <!-- All Data Section -->
            <div id="all-data-section" style="display: none;"></div>

            <!-- Config Section -->
            <div id="config-section" style="display: none;"></div>

        </main>
    </div>

    <!-- ============== SCRIPTS ============== -->
    <!-- External Libraries -->
    <script src="js/jquery-3.6.0.min.js"></script>
    <script src="js/jquery-ui.min.js"></script>
    <script src="js/jquery.datetimepicker.full.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.min.js"></script>

    <!-- Modular JavaScript Files -->
    <script src="js/main.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/pending-data.js"></script>
    <script src="js/retry-data.js"></script>
    <script src="js/klhk-success.js"></script>
    <script src="js/all-data.js"></script>
    <script src="js/config.js"></script>

    <!-- Component Loader Script -->
    <script>
        // Check authentication first
        async function checkAuthentication() {
            try {
                const response = await fetch('/api/auth/status');
                const data = await response.json();
                
                if (!data.authenticated) {
                    // Redirect to login page
                    window.location.href = '/login.html';
                    return false;
                }
                return true;
            } catch (error) {
                console.error('Error checking authentication:', error);
                window.location.href = '/login.html';
                return false;
            }
        }

        // Load components (header, sidebar, and sections)
        async function loadComponents() {
            try {
                // Load header
                const headerResponse = await fetch('/admin/components/header.html');
                const headerContent = await headerResponse.text();
                document.getElementById('header-container').innerHTML = headerContent;

                // Load sidebar - Fixed typo: sidebar.html
                const sidebarResponse = await fetch('/admin/components/sidebar.html');
                const sidebarContent = await sidebarResponse.text();
                document.getElementById('sidebar-container').innerHTML = sidebarContent;

                // Load sections
                const dashboardResponse = await fetch('/admin/sections/dashboard.html');
                const dashboardContent = await dashboardResponse.text();
                document.getElementById('dashboard-section').innerHTML = dashboardContent;

                const retryResponse = await fetch('/admin/sections/retry-data.html');
                const retryContent = await retryResponse.text();
                document.getElementById('retry-section').innerHTML = retryContent;

                const pendingDataResponse = await fetch('/admin/sections/pending-data.html');
                const pendingDataContent = await pendingDataResponse.text();
                document.getElementById('pending-data-section').innerHTML = pendingDataContent;

                const klhkSuccessResponse = await fetch('/admin/sections/klhk-success.html');
                const klhkSuccessContent = await klhkSuccessResponse.text();
                document.getElementById('klhk-success-section').innerHTML = klhkSuccessContent;

                const allDataResponse = await fetch('/admin/sections/all-data.html');
                const allDataContent = await allDataResponse.text();
                document.getElementById('all-data-section').innerHTML = allDataContent;

                const configResponse = await fetch('/admin/sections/config.html');
                const configContent = await configResponse.text();
                document.getElementById('config-section').innerHTML = configContent;

                // Components loaded successfully, now load dashboard data
                if (typeof loadDashboard === 'function') {
                    loadDashboard();
                }

                // Start real-time clock
                if (typeof startRealTimeClock === 'function') {
                    startRealTimeClock();
                }

            } catch (error) {
                console.error('Error loading components:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Failed to load admin components. Please refresh the page.',
                    confirmButtonColor: '#3085d6'
                });
            }
        }

        // Initialize admin page with authentication check
        async function initAdmin() {
            const isAuthenticated = await checkAuthentication();
            if (isAuthenticated) {
                loadComponents();
            }
        }

        // Load components when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAdmin);
        } else {
            initAdmin();
        }
    </script>

</body>
</html>
